name: Release mobile to Play Store

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front/mobile

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front/mobile/package-lock.json

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('front/mobile/android/**/*.gradle*') }}

      - name: Install dependencies
        run: npm ci

      # react-native-config reads this at build time (android/app/build.gradle line 2). These are
      # non-secret endpoint/client-id values, but still injected from GitHub secrets rather than
      # committed, so prod values never sit in the repo.
      - name: Write .env
        run: |
          cat <<EOF > .env
          AUTH_BASE_URL=${{ secrets.MOBILE_AUTH_BASE_URL }}
          KANJI_BASE_URL=${{ secrets.MOBILE_KANJI_BASE_URL }}
          WORD_BASE_URL=${{ secrets.MOBILE_WORD_BASE_URL }}
          GOOGLE_CLIENT_ID=${{ secrets.MOBILE_GOOGLE_CLIENT_ID }}
          ADMOB_APP_ID=${{ secrets.MOBILE_ADMOB_APP_ID }}
          ADMOB_BANNER_UNIT_ID=${{ secrets.MOBILE_ADMOB_BANNER_UNIT_ID }}
          ADMOB_INTERSTITIAL_UNIT_ID=${{ secrets.MOBILE_ADMOB_INTERSTITIAL_UNIT_ID }}
          ADMOB_REWARDED_UNIT_ID=${{ secrets.MOBILE_ADMOB_REWARDED_UNIT_ID }}
          EOF

      # Decoded once per run, never committed — android/app/build.gradle falls back to debug
      # signing when this file is absent, so local/PR builds are unaffected.
      - name: Decode release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/kanjiup-release.keystore
          cat <<EOF > android/app/keystore.properties
          storeFile=kanjiup-release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      # versionName follows the release tag (v1.4.2 -> 1.4.2); versionCode is the workflow run
      # number, guaranteed to strictly increase across releases with no extra bookkeeping.
      - name: Build release bundle
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          cd android
          ./gradlew bundleRelease \
            -PversionCode="${GITHUB_RUN_NUMBER}" \
            -PversionName="${VERSION_NAME}"

      # Base64, not raw JSON: a multi-line secret with embedded quotes/backslashes/escaped
      # newlines is fragile to paste into the GitHub secret UI (a corrupted paste here caused
      # "Neither PUB key nor PRIV key" from Ruby's OpenSSL, mirroring the earlier Node decoder
      # error) — base64 is a single clean line, same proven pattern as ANDROID_KEYSTORE_BASE64.
      - name: Write Play service account JSON
        run: |
          echo "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}" | base64 -d > google-play-service-account.json

      # Temporary: structural check only, never prints the key itself. Remove once the
      # "Neither PUB key nor PRIV key" mismatch is diagnosed.
      - name: Debug service account JSON structure
        run: |
          wc -c google-play-service-account.json
          python3 -c "
          import json, sys
          try:
              with open('google-play-service-account.json') as f:
                  d = json.load(f)
              print('valid JSON:', True)
              print('type:', d.get('type'))
              pk = d.get('private_key', '')
              print('starts with BEGIN marker:', pk.startswith('-----BEGIN PRIVATE KEY-----'))
              print('ends with END marker:', pk.rstrip().endswith('-----END PRIVATE KEY-----'))
              print('newline count in key:', pk.count(chr(10)))
          except Exception as e:
              print('JSON PARSE FAILED:', e)
              sys.exit(1)
          "

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Fastlane
        run: gem install fastlane -N

      # r0adkll/upload-google-play (Node-based) hits a JWT-signing bug under the Node version
      # GitHub now forces on all actions ("error:1E08010C:DECODER routines::unsupported",
      # reproduces with both plaintext and file-based key input — see r0adkll/upload-google-play#256,
      # unresolved). Fastlane supply is Ruby-based and unaffected.
      - name: Upload to Play Store (internal track)
        run: |
          fastlane supply \
            --json_key google-play-service-account.json \
            --package_name com.kanjiup \
            --aab android/app/build/outputs/bundle/release/app-release.aab \
            --track internal \
            --release_status completed \
            --skip_upload_metadata true \
            --skip_upload_images true \
            --skip_upload_screenshots true
